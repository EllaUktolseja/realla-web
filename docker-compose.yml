services:
  mongodb:
    image: mongo:8
    container_name: realla-web-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: realla_web
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
